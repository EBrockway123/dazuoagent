services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dazuoagent-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/health').read(); sys.exit(0)"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: node:20-alpine
    container_name: dazuoagent-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend